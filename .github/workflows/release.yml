name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build Blurface.exe
        run: pyinstaller --noconfirm --clean --windowed --onefile --name Blurface --collect-all imageio_ffmpeg --collect-all cv2 blur_faces.py
      - uses: actions/upload-artifact@v4
        with:
          name: Blurface-windows
          path: dist/Blurface.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -c "import tkinter"
          pip install -r requirements.txt pyinstaller
      - name: Build Blurface.app
        run: pyinstaller --noconfirm --clean --windowed --name Blurface --osx-bundle-identifier dev.blurface.app --collect-all imageio_ffmpeg --collect-all cv2 blur_faces.py
      - name: Create Blurface.dmg
        run: |
          codesign --force --deep --sign - dist/Blurface.app
          stage="dist/dmg"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -R dist/Blurface.app "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Blurface" -srcfolder "$stage" -ov -format UDZO dist/Blurface.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Blurface-macos
          path: dist/Blurface.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Windows exe and macOS dmg. These builds are not notarized."
          gh release upload "$tag" artifacts/Blurface-windows/Blurface.exe artifacts/Blurface-macos/Blurface.dmg --clobber
